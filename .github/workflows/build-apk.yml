name: Build APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 34 platform & build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ElNostreEquip-alpha.apk

      - name: Publish APK to rolling "alpha" release
        uses: ncipollo/release-action@v1
        with:
          tag: alpha
          name: "El Nostre Equip — APK alpha"
          body: "Compilación automática de la rama main. Versión de pruebas (debug)."
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: "ElNostreEquip-alpha.apk"
